<div
  class="group relative bg-cardBg rounded-[2rem] shadow-xl overflow-hidden border border-primary/5 transition-all duration-500 hover:-translate-y-3 hover:shadow-2xl hover:shadow-primary/20 flex flex-col h-full bg-gradient-to-br from-primary/5 to-transparent"
>
  <div class="h-72 flex items-center justify-center relative p-6">
    <div class="w-40 h-40 bg-white rounded-full flex items-center justify-center shadow-inner border-4 border-primary/20 animate-pulse">
      <mat-icon class="text-primary text-6xl w-14 h-14">card_giftcard</mat-icon>
    </div>
  </div>
  <div class="p-8 pt-4 flex flex-col flex-grow text-center">
    <h3 class="font-artistic text-2xl mb-3 text-textMain">{{ 'offersPage.birthday.title' | translate }}</h3>
    <p class="text-textMain/60 text-sm mb-6 leading-relaxed flex-grow">
      {{ 'offersPage.birthday.description' | translate }}
    </p>
    <button
      type="button"
      class="w-full py-3.5 rounded-xl bg-white border-2 border-primary text-primary font-bold hover:bg-primary hover:text-white transition-all duration-300 uppercase tracking-wide text-sm card-btn-glow ripple-btn"
      (click)="onCtaClick($event)"
      [routerLink]="['/auth/register']"
    >
      {{ 'offersPage.registerMember' | translate }}
    </button>
  </div>
</div>
