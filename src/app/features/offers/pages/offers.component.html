<section
  class="relative min-h-screen flex flex-col items-center pt-16 pb-24 overflow-hidden bg-gradient-to-br from-pink-50 via-background to-emerald-50 dark:from-neutral-900 dark:via-background dark:to-neutral-900 transition-colors duration-500 reveal-up"
  [class.active]="pageEntered()"
>
  <!-- Decorative bubbles -->
  <div class="absolute top-20 right-10 w-64 h-64 bg-accent/30 bubble-accent blur-3xl pointer-events-none"></div>
  <div class="absolute bottom-20 left-10 w-96 h-96 bg-secondary/20 bubble-accent blur-3xl pointer-events-none"></div>

  <!-- Hero -->
  <app-offers-hero></app-offers-hero>

  <app-offers-filter-pills
    [filters]="filters"
    [activeId]="activeFilterId()"
    (filterChange)="activeFilterId.set($event)"
  ></app-offers-filter-pills>

  <!-- Cards grid -->
  <div class="container mx-auto px-6 relative z-10" appScrollReveal="up" [scrollRevealDelay]="200">
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
      @for (offer of offers; track offer.id) {
        <app-offer-card [offer]="offer"></app-offer-card>
      }
      <app-offers-gift-card></app-offers-gift-card>
    </div>
  </div>

  <!-- VIP CTA block -->
  <div class="-mt-12" *ngIf="token() !== 'token_123'">
    <app-offers-vip-cta></app-offers-vip-cta>
  </div>
</section>
