<div class="glass-card rounded-[2rem] p-8 md:p-12 shadow-lg max-w-4xl mx-auto">
  <div class="flex justify-between items-center mb-8">
    <h2 class="text-2xl font-bold text-textMain flex items-center gap-2">
      <mat-icon class="text-primary">person_edit</mat-icon>
      {{ 'profilePage.editInfo.title' | translate }}
    </h2>
    <button
      (click)="onSave()"
      class="text-sm text-primary hover:text-primary/80 font-bold underline decoration-2 underline-offset-4"
    >
      {{ 'profilePage.editInfo.saveChanges' | translate }}
    </button>
  </div>
  <div class="grid grid-cols-1 md:grid-cols-2 gap-x-12 gap-y-8">
    <div class="space-y-6">
      <div class="group">
        <label class="block text-xs uppercase tracking-wider text-textMain/50 mb-1 font-bold">
          {{ 'profilePage.editInfo.fullName' | translate }}
        </label>
        <app-input-field
          type="text"
          placeholderKey="profilePage.editInfo.fullNamePlaceholder"
          [(ngModel)]="formData.name"
          customClasses="input-artistic py-3 text-lg"
        />
      </div>
      <div class="group">
        <label class="block text-xs uppercase tracking-wider text-textMain/50 mb-1 font-bold">
          {{ 'profilePage.editInfo.email' | translate }}
        </label>
        <app-input-field
          type="email"
          placeholder="email@example.com"
          [(ngModel)]="formData.email"
          customClasses="input-artistic py-3 text-lg"
        />
      </div>
      <div class="group">
        <label class="block text-xs uppercase tracking-wider text-textMain/50 mb-1 font-bold">
          {{ 'profilePage.editInfo.phone' | translate }}
        </label>
        <app-input-field
          type="tel"
          placeholder="09xx xxx xxx"
          [(ngModel)]="formData.phone"
          customClasses="input-artistic py-3 text-lg"
        />
      </div>
    </div>
    <div class="space-y-6">
      <div class="group">
        <label class="block text-xs uppercase tracking-wider text-textMain/50 mb-1 font-bold">
          {{ 'profilePage.editInfo.birthDate' | translate }}
        </label>
        <app-input-field
          type="date"
          [(ngModel)]="formData.birthDate"
          customClasses="input-artistic py-3 text-lg"
        />
      </div>
      <div class="group">
        <label class="block text-xs uppercase tracking-wider text-textMain/50 mb-1 font-bold">
          {{ 'profilePage.editInfo.address' | translate }}
        </label>
        <app-input-field
          type="text"
          placeholderKey="profilePage.editInfo.addressPlaceholder"
          [(ngModel)]="formData.address"
          customClasses="input-artistic py-3 text-lg"
        />
      </div>
      <div class="pt-4">
        <label class="flex items-center gap-3 cursor-pointer group">
          <div class="relative">
            <input 
              class="peer sr-only" 
              type="checkbox" 
              [checked]="formData.emailNotifications"
              (change)="updateField('emailNotifications', $any($event.target).checked)"
            />
            <div class="w-10 h-6 bg-gray-200 rounded-full peer peer-checked:bg-primary peer-focus:ring-2 peer-focus:ring-primary/20 dark:bg-gray-700 transition-colors"></div>
            <div class="absolute left-1 top-1 w-4 h-4 bg-white rounded-full transition-transform peer-checked:translate-x-4"></div>
          </div>
          <span class="text-sm text-textMain/70 group-hover:text-textMain transition-colors">
            {{ 'profilePage.editInfo.emailNotifications' | translate }}
          </span>
        </label>
      </div>
    </div>
  </div>
</div>
