<div class="animated-translate" [class]="class">
  <div class="words">
    <div
      class="words-inner words-inner-spin"
      [class.animating]="animating()"
      (transitionend)="onSpinEnd()"
    >
      @if (previousText()) {
        <span class="word">{{ previousText() }}</span>
      }
      <span class="word">{{ currentText() }}</span>
    </div>
  </div>
</div>
