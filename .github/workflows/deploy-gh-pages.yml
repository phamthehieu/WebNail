name: Deploy Angular app to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Angular app
        run: npx ng build --configuration production --base-href /WebNail/

      - name: Fix asset paths for GitHub Pages (absolute URLs)
        run: |
          cd dist/WebNail/browser
          sed -i 's|href="\([a-zA-Z0-9_-]*\.css\)"|href="/WebNail/\1"|g' index.html
          sed -i 's|href="\(chunk-[a-zA-Z0-9]*\.js\)"|href="/WebNail/\1"|g' index.html
          sed -i 's|src="\(main-[a-zA-Z0-9]*\.js\)"|src="/WebNail/\1"|g' index.html
          sed -i 's|href="favicon\.ico"|href="/WebNail/favicon.ico"|g' index.html
          sed -i 's|<meta http-equiv="Content-Security-Policy"[^>]*>||' index.html

      - name: Fix 404 for client-side routing (SPA)
        run: cp dist/WebNail/browser/index.html dist/WebNail/browser/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/WebNail/browser 

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4